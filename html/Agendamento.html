<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/agend.css" />
    <title>Agendamento</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="/InicioImgs/LOGO JANE.png" alt="" />
      </div>
      <div id="paginas">
        <a href="/index.html">Voltar</a>
      </div>
    </header>
    <main>
      <div class="agendar">
        <h1>Faça o seu agendamento agora!</h1>

        <form class="form-agendamento">
          <select name="servicos" required>
            <option value="" disabled selected>Serviços</option>
            <option value="corte">Corte</option>
            <option value="hidratacao">Hidratação</option>
            <option value="coloracao">Coloração</option>
            <option value="escova">Escova</option>
            <option value="mechas">Mechas</option>
            <option value="ozonioterapia">Ozonioterapia</option>
            <option value="reconstrução">Reconstrução</option>
          </select>

          <select name="tipoCabelo" required>
            <option value="" disabled selected>Tipo de Cabelo</option>
            <option value="liso">Liso</option>
            <option value="ondulado">Ondulado</option>
            <option value="cacheado">Cacheado</option>
            <option value="crespo">Crespo</option>
            <option value="curto">Curto</option>
          </select>

          <input type="tel" name="telefone" placeholder="Telefone:" required />

          <textarea
            name="observacao"
            placeholder="Alguma Observação:"
          ></textarea>

          <button type="submit">Agendar</button>
        </form>

        <div class="whatsapp">
          <p>Nosso Zap</p>
          <a href="https://wa.me/55SEUNUMEROAQUI" target="_blank">
            <img src="/fundos/whats.png" alt="WhatsApp" />
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
